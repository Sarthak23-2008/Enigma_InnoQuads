# Render Blueprint: FastAPI backend (Docker, includes Tesseract) + managed PostgreSQL + daily report cron.
# Frontend deploys separately on Vercel (see docs/DEPLOYMENT.md).
databases:
  - name: safebite-db
    plan: free
    databaseName: safebite
    user: safebite

services:
  - type: web
    name: safebite-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: safebite-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false            # set to your Vercel URL, e.g. https://safebite.vercel.app
      - key: OCR_PROVIDER
        value: tesseract
      - key: DEMO_MODE
        value: "true"
      - key: NOTIFICATION_PROVIDER
        value: mock

  - type: cron
    name: safebite-reports
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    schedule: "30 3 * * *"     # daily 09:00 IST
    dockerCommand: python -m app.jobs.send_reports
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: safebite-db, property: connectionString }
      - key: JWT_SECRET
        sync: false
      - key: NOTIFICATION_PROVIDER
        value: mock
